<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCF5 — 幾何の作品集</title>
<meta name="description" content="幾何学をめぐる6つのリアルタイム生成アート。共鳴・無限・多次元・量子・創世・暦。">
<meta property="og:title" content="CCF5 — 幾何の作品集">
<meta property="og:description" content="幾何学をめぐる6つのリアルタイム生成アート（WebGL2）">
<style>
  :root{
    --bg:#07070c; --bg2:#0c0c14; --ink:#f2efe6; --sub:#9a95a8; --dim:#615c72;
    --line:#1e1c2a; --gold:#d9b26a; --gold2:#f0d59a;
    --a1:#e0c56a; --a2:#7fd6a0; --a3:#6fc3e6; --a4:#b79cff; --a5:#ff9ec4; --a6:#f2e3c0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Hiragino Mincho ProN","YuMincho","Georgia",serif;
    background:
      radial-gradient(1200px 700px at 80% -20%,rgba(217,178,106,.10),transparent 60%),
      radial-gradient(900px 600px at 10% 110%,rgba(111,195,230,.07),transparent 55%),
      var(--bg);
    color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:64px 28px 90px}

  /* hero */
  .hero{text-align:center;margin-bottom:12px}
  .kicker{font-family:"Helvetica Neue",sans-serif;letter-spacing:.42em;font-size:11px;color:var(--gold);text-indent:.42em;margin-bottom:20px}
  h1{font-size:clamp(30px,6vw,52px);font-weight:600;letter-spacing:.06em;line-height:1.2}
  h1 .en{display:block;font-family:"Helvetica Neue",sans-serif;font-weight:300;font-size:.32em;letter-spacing:.34em;color:var(--sub);margin-top:16px;text-indent:.34em}
  .lead{max-width:600px;margin:26px auto 0;color:var(--sub);font-size:15px;line-height:2}
  .rule{width:1px;height:52px;margin:34px auto 0;background:linear-gradient(var(--gold),transparent)}

  /* gallery grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:54px}
  .piece{position:relative;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:4px;overflow:hidden;
    background:var(--bg2);aspect-ratio:4/3;display:flex;flex-direction:column;justify-content:flex-end;
    transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .4s,box-shadow .4s}
  .piece:hover{transform:translateY(-6px);border-color:rgba(217,178,106,.5);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(217,178,106,.15)}
  .piece .canvas{position:absolute;inset:0;overflow:hidden;background:#05050a}
  .piece .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.94;
    transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .4s}
  .piece:hover .thumb{transform:scale(1.06);opacity:1}
  .piece .canvas::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,transparent 40%,rgba(5,5,10,.35));pointer-events:none}
  .piece .num{position:absolute;top:16px;left:18px;font-family:"Helvetica Neue",sans-serif;font-size:11px;letter-spacing:.24em;color:rgba(255,255,255,.55);z-index:3}
  .piece .cap{position:relative;z-index:3;padding:20px 20px 22px;background:linear-gradient(0deg,rgba(7,7,12,.94) 12%,rgba(7,7,12,.55) 60%,transparent)}
  .piece .ttl{font-size:19px;font-weight:600;letter-spacing:.03em}
  .piece .sub{font-family:"Helvetica Neue",sans-serif;font-size:10.5px;letter-spacing:.16em;color:var(--gold);margin-top:5px;text-transform:uppercase}
  .piece .dsc{font-size:12.5px;color:var(--sub);line-height:1.75;margin-top:11px;max-height:0;opacity:0;overflow:hidden;transition:max-height .45s ease,opacity .35s,margin .35s}
  .piece:hover .dsc{max-height:120px;opacity:1}
  .piece .open{position:absolute;top:14px;right:16px;z-index:3;font-family:"Helvetica Neue",sans-serif;font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:4px 11px;transition:.3s}
  .piece:hover .open{color:var(--bg);background:var(--gold);border-color:var(--gold)}

  /* footer / how */
  .foot{margin-top:66px;padding-top:34px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:26px;justify-content:space-between;align-items:center}
  .foot .note{color:var(--dim);font-size:12px;line-height:1.9;font-family:"Helvetica Neue",sans-serif;letter-spacing:.02em;max-width:560px}
  .foot .note b{color:var(--sub);font-weight:500}
  .sig{font-family:"Helvetica Neue",sans-serif;font-size:11px;letter-spacing:.24em;color:var(--gold);text-align:right}

  @media(max-width:880px){.grid{grid-template-columns:1fr 1fr;gap:18px}.piece .dsc{max-height:120px;opacity:1}}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="kicker">CCF5 SERIES · 2026</div>
    <h1>幾何の作品集<span class="en">SIX STUDIES IN GEOMETRY</span></h1>
    <p class="lead">音は形になり、方程式は光になる。<br>幾何学をめぐる6つのリアルタイム生成アート。<br>各作品はブラウザの中で毎秒、いま計算されて生まれています。</p>
    <div class="rule"></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="foot">
    <div class="note">
      <b>鑑賞のしかた</b>　作品をクリックすると全画面で開きます（『二十四節気の円環』のみ別タブ）。ドラッグ・ホイール・キーで反応します（各画面に操作ヒント表示）。<br>
      WebGL2のリアルタイム生成。01〜05は単一HTML・外部依存なし。
    </div>
    <div class="sig">MATSUISHI KEISUKE<br><span style="color:var(--dim)">REGEN DAY · 2026.07.13</span></div>
  </div>

</div>

<script>
  const WORKS=[
    {n:"01",dir:"art01",ttl:"共鳴譜",en:"Cymatic Resonance",col:"var(--a1)",
     dsc:"52万粒の砂が音を「見る」。クラドニ図形の物理シミュレーション。マイクを開けば、あなたの声が幾何学として結晶する。"},
    {n:"02",dir:"art03",ttl:"無限幾何回廊",en:"Infinite Geometry",col:"var(--a3)",
     dsc:"円のなかに円、そのなかにまた円。アポロニウスのガスケットを永遠に潜行する。原子から銀河まで同じ幾何学。"},
    {n:"03",dir:"art04",ttl:"HOPF LOOM",en:"S³ の織物",col:"var(--a4)",
     dsc:"四次元球面S³を無数の円が編み上げるHopfファイブレーション。見えないはずの多次元の織物を、いま目の前で織る。"},
    {n:"04",dir:"art05",ttl:"量子曼荼羅",en:"Quantum Mandala",col:"var(--a5)",
     dsc:"絵ではなく方程式そのもの。シュレーディンガー方程式をGPUで実時間で解いた波動関数|ψ|²。聖なる幾何学が定常波紋を編む。"},
    {n:"05",dir:"art06",ttl:"幾何の創世",en:"Genesis of Form",col:"var(--a6)",
     dsc:"無から最初の円が引かれ、フラワー・オブ・ライフを経てメタトロン・キューブが立ち上がり、再び無へ還る。68秒の創世神話。"},
    {n:"06",dir:"ring",href:"https://nijushisekki-ring.vercel.app",ttl:"二十四節気の円環",en:"The Ring of Twenty-Four Seasons",col:"var(--a1)",
     dsc:"太陽黄経360°を24等分し、一年を円環として巡る暦の幾何学。触れると季節の流れが撹拌される、生きたアルマナック。（別タブで開きます）"},
  ];
  const grid=document.getElementById('grid');
  WORKS.forEach((w,i)=>{
    const a=document.createElement('a');a.className='piece';
    a.href=w.href||(w.dir+'/');
    if(w.href){a.target='_blank';a.rel='noopener';}
    a.innerHTML=`
      <div class="canvas"><img class="thumb" src="thumbs/${w.dir}.jpg" loading="lazy" alt="${w.ttl} ${w.en}"></div>
      <div class="num">CCF5 · ${w.n}</div>
      <div class="open">OPEN ↗</div>
      <div class="cap">
        <div class="ttl">${w.ttl}</div>
        <div class="sub">${w.en}</div>
        <div class="dsc">${w.dsc}</div>
      </div>`;
    grid.appendChild(a);
  });
</script>
</body>
</html>
